worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── forum.rjsgud.com HTTP → HTTPS ───────────────────────────────────────
    server {
        listen 80;
        server_name forum.rjsgud.com;

        location /.well-known/acme-challenge/ {
            root C:/certificates;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ─── forum.rjsgud.com HTTPS ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name forum.rjsgud.com;

        ssl_certificate         C:/Nginx/ssl/forum.rjsgud.com-crt.pem;
        ssl_certificate_key     C:/Nginx/ssl/forum.rjsgud.com-key.pem;
        ssl_trusted_certificate C:/Nginx/ssl/forum.rjsgud.com-chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        location = /uploads {
            return 301 /uploads/;
        }

        location ^~ /ws {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            proxy_buffering off;
        }

        location ^~ /uploads/ {
            alias C:/app-data/uploads/;
            autoindex off;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
            }
            default_type image/jpeg;
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin *;
            try_files $uri =404;
            location ~* /\. { deny all; }
        }

        location = /api-docs/ {
            return 301 /api-docs;
        }

        location ^~ /api-docs {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /swagger-ui {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /v3/api-docs {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── gacha.rjsgud.com HTTP → HTTPS ───────────────────────────────────────
    server {
        listen 80;
        server_name gacha.rjsgud.com;

        location /.well-known/acme-challenge/ {
            root C:/certificates;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ─── gacha.rjsgud.com HTTPS ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name gacha.rjsgud.com;

        ssl_certificate         C:/Nginx/ssl/gacha.rjsgud.com-crt.pem;
        ssl_certificate_key     C:/Nginx/ssl/gacha.rjsgud.com-key.pem;
        ssl_trusted_certificate C:/Nginx/ssl/gacha.rjsgud.com-chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;

        location / {
            proxy_pass         http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ─── study.rjsgud.com HTTP → HTTPS ───────────────────────────────────────
    server {
        listen 80;
        server_name study.rjsgud.com;

        location /.well-known/acme-challenge/ {
            root C:/certificates;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ─── study.rjsgud.com HTTPS ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name study.rjsgud.com;

        ssl_certificate         C:/Nginx/ssl/study.rjsgud.com-crt.pem;
        ssl_certificate_key     C:/Nginx/ssl/study.rjsgud.com-key.pem;
        ssl_trusted_certificate C:/Nginx/ssl/study.rjsgud.com-chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── jenkins.rjsgud.com HTTP (ACME + 임시 프록시, 인증서 후 HTTPS로 넘김) ──
    server {
        listen 80;
        server_name jenkins.rjsgud.com;

        location /.well-known/acme-challenge/ {
            root C:/certificates;
        }

        client_max_body_size 100m;
        ignore_invalid_headers off;

        location / {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}